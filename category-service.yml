info:
  application:
    name: CATEGORY-SERVICE
    version: 1.0.0
    maintainer:
      author: WAKEU Georges Favier
      email: georgeswakeu21@gmail.com

management:
  endpoints:
    web:
      exposure:
        include: '*'
  info:
    build:
      enabled: true
    env:
      enabled: true

spring:
  # Configuration de la base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/scheriff
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    
    # Configuration du pool de connexions HikariCP (optionnel)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # Configuration JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop  # Options: create, create-drop, update, validate, none
    show-sql: false  # Mettre à true pour voir les requêtes SQL en développement
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Configuration spécifique PostgreSQL
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  servlet:
    context-path: /api

