# ===== category-service-dev.yml (Config Server) =====
server:
  servlet:
    context-path: /api
  port: ${SERVER_PORT:8082}

spring:
  # Configuration de la base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/scheriff
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    
    # Configuration du pool de connexions HikariCP
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # Configuration JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # CHANGÉ: create-drop vers update pour dev
    show-sql: true  # CHANGÉ: false vers true pour dev
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true